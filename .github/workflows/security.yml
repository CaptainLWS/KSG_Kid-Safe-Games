name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high